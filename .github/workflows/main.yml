name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cheap, and it saves finding out from a failed push at the end of a long
      # build. No model-host tokens are needed here — the weights are fetched by
      # the pod on first boot, not baked in.
      - name: Check the secrets this build needs
        run: |
          missing=""
          [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "${{ secrets.DOCKERHUB_TOKEN }}"    ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # This is what makes the build fit. A hosted runner has ~14GB free on /
      # and ~70GB on /mnt; the image is roughly 20GB uncompressed and the build
      # cache is more on top, so / alone runs out and the job dies mid-push with
      # "no space left on device". Moving Docker's data-root to /mnt is worth
      # far more than deleting toolchains, though we do both.
      - name: Make room for the build
        run: |
          echo "── before ──"; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /usr/share/swift \
                      /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true

          # docker.socket restarts the daemon on demand, so it has to go down
          # too or the config change is reverted out from under us.
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'docker root: {{.DockerRootDir}}'

          echo "── after ──"; df -h / /mnt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          # The commit tag is the one that matters. RunPod caches by tag, so a
          # pod template pinned to :latest can keep launching a stale image
          # after a push — point the template at a specific sha instead, and
          # rolling back is just selecting the previous one.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-acg-krea2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-acg-krea2:${{ github.sha }}
          # Registry cache, not type=gha: the GitHub Actions cache is capped at
          # 10GB per repository and the dependency layer alone blows through
          # that, so type=gha thrashes and every build is a cold one. A
          # dedicated Docker Hub tag holds it instead, which is what turns a
          # start.sh-only change into a two-minute build.
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/comfyui-acg-krea2:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/comfyui-acg-krea2:buildcache,mode=max
          provenance: false
          sbom: false

      - name: Report
        if: always()
        run: |
          df -h / /mnt
          echo "Deploy this tag on the RunPod pod template:"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-acg-krea2:${{ github.sha }}"
